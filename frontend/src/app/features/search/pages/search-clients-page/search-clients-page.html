<div class="wrapper">
  <app-search-bar placeholder="Enter client's email or name..." (onEndTyping)="onSearchQuery($event)" />
  <div class="search-result">
    <div class="list">
      @let beforeAnySearch = searchService.beforeSearch;

      @if(searchResult().length){
        @for (user of searchResult(); track user.id) {
          <app-profile-preview
            [pfpUrl]="user.pfpUrl"
            [fullName]="user.fullName"
            [email]="user.email"
            [active]="true"
          />
        }
      }
      @else if(beforeAnySearch){
        <div class="three-dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      }
      @else if(!beforeAnySearch){
        <span class="no-result">No users found by this query</span>
      }
    </div>
  </div>
</div>
