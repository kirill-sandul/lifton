<app-week-dropdown [weekIndex]="weekIndex()">
  <div class="content-wrapper">
    <div class="week-days-selector">
      @for (day of weekDays; track day) {
        <div class="week-day" [class.selected]="selectedWeekDay() === day" (click)="selectedWeekDay.set(day)">
          {{ day | weekDay: 'short' }}
        </div>
      }
    </div>

    <app-workout-details [workoutData]="selectedDayWorkout()" />
  </div>
</app-week-dropdown>
