<div class="create-program">
  <div class="wrapper">
    <header>
      <h1 class="title">Create new training program</h1>
      <app-tabs-button
        class="tabs"
        [options]="createProgramTabs"
        [style]="'dark'"
        (onSelectOption)="onChangeTabs($event)"
        [(selectorStep)]="selectedTabIdx"
      />
    </header>
    <main class="form">
      @let selectedTab = createProgramTabs[selectedTabIdx()];
      @switch (selectedTab.label) {
        @case ('Base info') {
          <div class="base-info-field">
            <label class="label">Program name</label>
            <app-input class="control" name="Program name" [control]="programNameControl" />
          </div>
          <div class="base-info-field">
            <label class="label">Span type</label>
            <app-select-input class="control" [control]="selectSpanControl" [compact]="true" [options]="programSpanOptions" />
          </div>
        }
        @case ('Schedule') {
          <div class="schedule">
            <span class="schedule-title">Schedule</span>
            <div class="weeks">
              @for(week of createProgramFacade.trainingProgramModel().weeks; track $index){
                <app-week-dropdown [weekIndex]="$index" />
              }
            </div>
          </div>
        }
        @case ('Targets'){

        }
      }
    </main>
    <footer>
      <button
        liftonButton
        class="next-step-btn compact"
        [disabled]="prevTabDisabled()"
        (click)="prevTab()"
      >
        <svg lucideIcon="move-left"></svg>
        <span>Previous step</span>
      </button>
      <button
        liftonButton
        class="next-step-btn compact"
        (click)="nextTab()"
      >
        @if(nextTabDisabled()){
          <span>Create program</span>
          <svg lucideIcon="plus"></svg>
        }
        @else {
          <span>Next step</span>
          <svg lucideIcon="move-right"></svg>
        }

      </button>
    </footer>
  </div>
</div>
