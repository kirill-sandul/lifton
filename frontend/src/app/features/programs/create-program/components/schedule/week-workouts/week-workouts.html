<app-week-dropdown [weekIndex]="weekIndex()">
  <app-workout-generator #generator [weekIndex]="weekIndex()" />
  <app-workouts-list
    [workoutsList]="getWorkouts()"
    [weekIndex]="weekIndex()"
    (editWorkout)="generator.editWorkoutMode($event.index, $event.workout)"
    (onRemoveWorkout)="generator.resetEditingMode($event.index)"
  />
</app-week-dropdown>
