<div class="widget">
  <h3>Schedule</h3>
  <div class="calendar">
    <div class="week">
      @for (day of week; track $index) {
        <div class="cell">
          <div class="week-day">
            {{ day | date: 'EEE' }}
          </div>
          <div
            class="day"
            (click)="selectedDay.set(day); onSelectDay.emit(selectedDay())"
            [class.selected]="selectedDay().toDateString() === day.toDateString()"
          >
            {{ day | date: 'd' }}
          </div>
        </div>
      }
    </div>
  </div>
  <div class="content">
    <div class="line"></div>
    <ng-content />
  </div>
</div>
