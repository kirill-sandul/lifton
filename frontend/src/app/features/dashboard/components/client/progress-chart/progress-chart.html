<div class="widget">
  <div class="top-text">
    <h3>Your progress in details</h3>

    @let _progressChart = clientFacade.progressChart();
    @if(_progressChart && _progressChart.chartData.length > 0){
      <progress-chart-exercise-selector (onSelect)="selectedExercise.set($event)" [options]="exerciseSelectorOptions" />
    }
  </div>
  @if(_progressChart && _progressChart.chartData.length > 0){
    <div class="progress-chart">
      <div class="chart">
        <canvas baseChart [data]="lineChartData()" [options]="lineChartOptions" [type]="lineChartType"></canvas>
      </div>
    </div>
  }
  @else {
    <div class="no-progress">
      <div class="icon-wrapper">
        <svg lucideIcon="chart-no-axes-combined"></svg>
      </div>
      <span class="grey">Your progress will appear here</span>
    </div>
  }
</div>
