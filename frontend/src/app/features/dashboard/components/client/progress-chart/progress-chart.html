<div class="widget">
  <div class="top-text">
    <h3>Your progress week by week</h3>
    <div class="percentage">
      <span class="percent success">12.1%</span>
      <span class="date grey">Last week</span>
    </div>
  </div>
  <div class="progress-chart">
    <div class="chart">
      <canvas baseChart [data]="lineChartData" [options]="lineChartOptions" [type]="lineChartType"></canvas>
    </div>
  </div>
</div>
