    <div class="progress">
      <app-progress-bar [completion]="42" class="progress-bar" />
      <div class="percentage">42%</div>
    </div>
    <div class="text-wrapper">
      <div class="text">

      </div>

      </div>
    </div>

  </div>
</div>
