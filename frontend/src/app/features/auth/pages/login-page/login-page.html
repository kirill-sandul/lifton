<form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  <app-input
    id="email"
    name="Email"
    placeholder="Enter your email"
    [control]="loginForm.controls.email"
  >
    <svg lucideAtSign [strokeWidth]="1.5" class="icon-theme-color"></svg>
  </app-input>
  <app-input
    id="password"
    name="Password"
    type="password"
    placeholder="Enter your password"
    [control]="loginForm.controls.password"
  >
  </app-input>

  <button liftonButton>Log in</button>
</form>
