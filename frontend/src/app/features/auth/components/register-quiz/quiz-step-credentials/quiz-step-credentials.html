<div class="quiz-align-center">
  <h1>Final step</h1>
  <div class="line"></div>
  <form class="register-form" [formGroup]="formGroup()">
    <app-input
      id="fullName"
      name="Your full name"
      placeholder="Enter your full name"
      [control]="formGroup().controls.fullName"
      [style]="'filled'"
    >
      <svg lucideUserRound></svg>
    </app-input>
    <app-input
      id="phone"
      name="Phone number"
      placeholder="Enter your mobile phone number"
      [control]="formGroup().controls.phone"
      [style]="'filled'"
    >
      <svg lucidePhone></svg>
    </app-input>
    <app-input
      id="email"
      name="Email"
      type="email"
      placeholder="Enter your email"
      [control]="formGroup().controls.email"
      [style]="'filled'"
    >
      <svg lucideMail></svg>
    </app-input>
    <app-input
      id="password"
      name="Password"
      type="password"
      placeholder="Enter your password"
      [control]="formGroup().controls.password"
      [style]="'filled'"
    >
    </app-input>

    <button liftonButton [disabled]="formGroup().invalid" (click)="onSubmit.emit()">Create account</button>
  </form>
</div>
