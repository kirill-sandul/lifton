<ng-content />
@if (icon()) {
  @if(icon() == "play") {
    <svg class="icon" lucidePlay></svg>
  }

  @if(icon() == "msg") {
    <svg class="icon" lucideSend></svg>
  }

  @if(icon() == "arrowUp") {
    <svg class="icon" lucideArrowUpRight></svg>
  }
}

@if(tooltip() && showTooltip()){
  <div class="tooltip" animate.leave="tooltip-deleting">{{ tooltip() }}</div>
}
