<div class="input-wrapper mock-input" [class]="style() == 'outlined' ? 'outlined' : 'filled'" (click)="fileInput.click()">
  <input
    class="input-wrapper"
    [placeholder]="placeholder()"
    [value]="control().value?.name || ''"
    readonly
  />
  <input
    #fileInput
    type="file"
    accept="image/png, image/jpeg"
    hidden
    [id]="id()"
    [name]="id()"
    (change)="onFileUpload($event)"
  />
  <svg lucideUpload></svg>
</div>
