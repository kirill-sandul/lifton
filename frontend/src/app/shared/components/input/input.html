<div class="input-wrapper">
  <input [id]="id()" [placeholder]="placeholder()" [formControl]="control()" type="text">

  <ng-content />
</div>

@if(control().invalid && control().touched) {
  <div class="invalid-msg">
    <img src="/assets/error.png" alt="">
    <span>{{ invalidMsg() }}</span>
  </div>
}
