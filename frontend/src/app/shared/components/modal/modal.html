<div class="modal-window-wrapper" (click)="onOutClick($event)">
  <div class="modal-window" style="max-width: {{maxWidth()}}px">
    <header class="top-row">
      <h2>{{ title() }}</h2>
      @if(subTitle()){
        <p class="subtitle grey">{{ subTitle() }}</p>
      }
    </header>
    <main class="content">
      <ng-content />
    </main>
    <footer class="bottom-row">
      @if(acceptOption()){
        <button liftonButton (click)="onSubmit.emit()" [disabled]="acceptBtnDisabled()">{{ acceptOption() }}</button>
      }
      <button liftonButton (click)="onDiscard.emit()" class="red-tone">{{ discardOption() }}</button>
    </footer>
  </div>
</div>
