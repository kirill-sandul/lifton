<header>
  <div class="left-section">
    <div class="logo" routerLink="/">
      <img src="/assets/lifton-logo.png" alt="">
    </div>
    <nav>
      <!-- <ul class="tabs">
          <li class="tab" routerLink="">
            Overview
          </li>
          <li class="tab" routerLink="">
            Clients
          </li>
          <li class="tab" routerLink="">
            Programs library
          </li>
        </ul> -->
        <app-tabs-button
          [options]="['Overview', 'Workouts', 'Start workout']" 
          [optionsLinks]="['', '', '']" 
          [selectedOption]="selectedTab()"
          [style]="'dark'"
        />
      </nav>
  </div>

  <nav>  
    <ul class="profile">
      <li>
        <button>
          <svg lucideSun></svg>
        </button>
      </li>
      <li>
        <button>
          <svg lucideBell></svg>
        </button>
      </li>
      <li>
        <button>
          <svg lucideMail></svg>
        </button>
      </li>
      <li routerLink="/profile">
        <div class="profile-widget">
          <div class="pfp pfp-style mini" [style.backgroundImage]="`url(${profile?.pfpUrl ?? '/assets/no-pfp.png'})`"></div>
          <div class="wrapper">
            <div class="text">
              <span class="fullName">{{ profile?.fullName }}</span>
              <svg lucideMoveRight></svg>
            </div>
            <div class="brief-props">
              <span>{{ profile?.role | userRole | lowercase }}</span>
              <span class="dot">•</span>
              <span>{{ profile?.email }}</span>
            </div>
          </div>
        </div>
      </li>
    </ul>
  </nav>
</header>
