<header>
  <div class="left-section">
    <div class="logo" routerLink="/">
      <img src="/assets/lifton-logo.png" alt="">
    </div>
    <nav>
      <app-tabs-button
        [options]="navOptions().labels"
        [optionsLinks]="navOptions().links"
        [selectedOption]="selectedTab()"
        [style]="'dark'"
      />
    </nav>
  </div>

  <nav>
    <ul class="profile">
      <li>
        <button>
          <svg lucideSun></svg>
        </button>
      </li>
      <li>
        <button>
          <svg lucideBell></svg>
        </button>
      </li>
      <li routerLink="/profile">
        @if (profile; as p){
          <app-profile-widget [profile]="p" />
        }
      </li>
    </ul>
  </nav>
</header>
